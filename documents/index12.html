<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Eid Al Etihad Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--ink:#121a22;--cream:#F4EED7;--bg:#7E955B;--soft:#D5EACF;--ease:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0c1116;color:var(--ink);font-family:'Oswald',system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
#stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:var(--bg);overflow:hidden}

/* screens: the next one opens as a circle from the tap point while the old one recedes */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5%;visibility:hidden;background:var(--bg) var(--bgimg,none) center/cover no-repeat}
.screen.on{visibility:visible;z-index:1}
.screen.enter{z-index:2;animation:open 1.15s var(--io) both}
.screen.out{animation:recede 1.15s var(--io) both}
@keyframes open{from{clip-path:circle(0 at var(--cx,50%) var(--cy,50%))}to{clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}}
@keyframes recede{to{transform:scale(.93);opacity:.55}}

/* entrances: transform + opacity, one easing curve */
#start.on>:not(.mark):not(.cta),#intro.on>.rz,#edit.on>:not(.mark),#res.on>:not(#pwrap):not(.mark){animation:rise 1.2s var(--ease) calc(var(--d,.2s) + .3s) both}
@keyframes rise{from{opacity:0;transform:translateY(4vh)}to{opacity:1;transform:none}}
#start.on>.logo,#intro.on>.logo{animation:logoIn 1.4s var(--ease) calc(var(--d) + .3s) both}
@keyframes logoIn{from{clip-path:inset(100% 0 0 0);transform:scale(1.08)}to{clip-path:inset(0);transform:none}}

.logo{position:relative;width:var(--col);height:auto;display:block}
.tag{position:relative;margin:5vh 0;font-size:clamp(16px,2.6vh,34px);letter-spacing:.14em}

/* buttons: magnetic, fill grows from the cursor entry point, label rolls */
.btn{--fill:var(--ink);--on:var(--cream);position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:1.6vh;cursor:pointer;text-decoration:none;
  font:inherit;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(16px,2.8vh,34px);
  padding:2vh 4.5vh;border:2px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);
  transform:translate(var(--tx,0),var(--ty,0));transition:color .5s var(--ease),transform .6s var(--ease)}
.btn::before{content:"";position:absolute;z-index:-1;left:var(--px,50%);top:var(--py,50%);width:260%;aspect-ratio:1;border-radius:50%;background:var(--fill);
  transform:translate(-50%,-50%) scale(0);transition:transform .8s var(--io)}
.btn.hot::before,.btn:focus-visible::before{transform:translate(-50%,-50%) scale(1)}
.btn.hot,.btn:focus-visible{color:var(--on);outline:none}
.btn.solid{background:var(--ink);color:var(--cream);--fill:var(--soft);--on:var(--ink)}
.btn:active{transform:translate(var(--tx,0),var(--ty,0)) scale(.96);transition-duration:.12s}
.roll{display:block;overflow:hidden;height:1.25em;line-height:1.25}
.roll b{display:block;font-weight:inherit;transition:transform .7s var(--ease)}
.btn.hot .roll b,.btn:focus-visible .roll b{transform:translateY(-100%)}
.arr{font-style:normal;display:inline-block;transition:transform .7s var(--ease)}
.btn.hot .arr{transform:translateX(1.4vh)}
button[hidden]{display:none}
#err{margin:2vh 0 0;font-size:clamp(13px,2vh,24px);max-width:80%;min-height:1.2em}
#pick{margin-top:2vh}

/* camera */
#cam{padding:0;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#frame{position:absolute;inset:5%;z-index:1}
#frame i{position:absolute;width:7vh;height:7vh;border:0 solid #fff;opacity:0;transform:scale(1.25);transition:opacity .9s var(--ease) .5s,transform 1.2s var(--ease) .5s}
#cam.on #frame i{opacity:1;transform:none}
#frame i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}#frame i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
#frame i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}#frame i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}
#count{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:min(42vh,66vw);color:#fff;overflow:hidden;line-height:1}
#num{display:block}
#num.tick{animation:tick 1s both}
@keyframes tick{
  0%{opacity:0;transform:translateY(32%) scale(.92);animation-timing-function:var(--ease)}
  38%{opacity:1;transform:none}
  72%{opacity:1;transform:none;animation-timing-function:var(--io)}
  100%{opacity:0;transform:translateY(-32%) scale(1.04)}}
#bar{position:absolute;z-index:1;left:5%;right:5%;bottom:3%;height:3px;background:#fff;transform-origin:left;transform:scaleX(0)}
#bar.run{animation:bar 3s linear both}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#hint{position:absolute;z-index:1;top:8%;left:0;right:0;margin:0;color:#fff;font-size:clamp(16px,2.6vh,32px);letter-spacing:.18em}
#flash{position:absolute;inset:0;z-index:2;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .7s var(--ease)}
@keyframes fl{from{opacity:1}to{opacity:0}}

/* result */
#res{justify-content:flex-start;gap:2vh;padding-top:3vh}
#photo{height:58%;aspect-ratio:9/16;object-fit:cover;background:var(--soft)}
#row{display:flex;gap:2.4vh;align-items:center;justify-content:center}
#qrbox{background:#fff;color:var(--ink);padding:1.6vh;display:flex;align-items:center;justify-content:center;min-width:19vh;min-height:19vh;font-size:clamp(12px,1.8vh,22px);letter-spacing:.08em}
#qrbox svg{display:block;height:17vh;width:17vh;animation:fade .9s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.qrtext{text-align:start}.qrtext .qt{font-weight:600;letter-spacing:.3em;font-size:clamp(16px,2.6vh,32px)}.qrtext .en{font-weight:600;letter-spacing:.3em;margin:0;font-size:clamp(16px,2.6vh,32px)}
.qrtext .ar{font-family:'Reem Kufi',serif;font-size:clamp(22px,3.6vh,44px);font-weight:500;margin-top:.6vh}
#msg{margin:0;font-size:clamp(13px,2vh,24px);letter-spacing:.1em;min-height:1.2em}
.actions{display:flex;gap:1.6vh}
.actions .btn{padding:1.8vh 3vh;font-size:clamp(14px,2.3vh,28px)}
#confetti{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}

/* ===== shared ===== */
.mark{position:absolute;width:21%;height:auto;z-index:0;pointer-events:none;opacity:0;translate:calc(var(--mx,0)*3vh) calc(var(--my,0)*3vh);transition:translate 1.4s var(--ease)}
.screen.on>.mark{animation:markIn 1.3s var(--ease) .7s both}
@keyframes markIn{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
#intro>:not(#drift),#start>:not(.mark),#edit>:not(.mark),#res>:not(.mark){position:relative;z-index:1}
#err,#msg,#row{background:var(--cream)}
.logo{margin-bottom:4vh}
#err,#msg{padding:1vh 2vh}
#err:empty,#msg:empty,#emsg:empty{display:none}
#row{padding:1.4vh 2.4vh}
.btn.sm{padding:1.3vh 2.6vh;font-size:clamp(13px,2.1vh,26px)}
.steps{display:flex;align-items:center;justify-content:center;flex:none;background:var(--cream);padding:1.1vh 2.4vh}
.steps b{display:flex;align-items:center;gap:1vh;font-weight:500;letter-spacing:.1em;font-size:clamp(12px,1.9vh,24px);color:rgba(18,26,34,.45);background:none;padding:0}
.steps b i{font-style:normal;width:3.6vh;height:3.6vh;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.95em;letter-spacing:0}
.steps b+b::before{content:"";width:3.6vh;height:2px;background:rgba(18,26,34,.25);margin:0 1.4vh}
.steps b.on{color:var(--ink);background:none}
.steps b.on i{background:var(--ink);color:var(--cream);border-color:var(--ink)}
#cam .steps{position:absolute;top:2.5%;left:50%;transform:translateX(-50%);z-index:2}
#hint{top:8%}

/* ===== intro ===== */
#intro{cursor:pointer;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center}
#bigw{align-self:end;padding-bottom:4vh}
#intro>.logo{margin:0}
#intro>.langs{align-self:start;margin:5vh 0 0}
#drift{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.spr{position:absolute;width:auto;opacity:0;filter:drop-shadow(0 1vh 1.2vh rgba(0,0,0,.18));
  animation:sprIn 1.2s var(--ease) var(--dl) both,bob var(--dur) ease-in-out calc(var(--dl) + 1.2s) infinite alternate}
@keyframes sprIn{from{opacity:0;translate:0 6vh;scale:.8}to{opacity:1;translate:0 0;scale:1}}
@keyframes bob{from{transform:translate(0,0) rotate(-3deg)}to{transform:translate(2.5vh,-2vh) rotate(3deg)}}
#big55{height:12vh;width:auto;display:block;filter:drop-shadow(0 .8vh 0 rgba(18,26,34,.2))}
#big55.pop{animation:pop .9s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-10deg)}60%{transform:scale(1.06) rotate(2deg)}to{opacity:1;transform:none}}
.wish{margin:0;background:var(--cream);padding:1.4vh 3vh;font-size:clamp(15px,2.6vh,32px);letter-spacing:.1em;font-weight:500}
.wish span{display:block;font-family:'Reem Kufi',serif;font-size:1.25em;letter-spacing:0;margin-top:.4vh}
.touch{margin:1vh 0 0}
.touch span{display:inline-block;background:var(--ink);color:var(--cream);padding:1.8vh 4.4vh;font-weight:600;letter-spacing:.16em;font-size:clamp(14px,2.4vh,30px);animation:pulse 1.8s var(--io) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ===== start ===== */
.how{list-style:none;margin:0 0 3vh;padding:0;display:flex;gap:1.4vh}
.how li{background:var(--cream);padding:1.6vh 2.4vh;min-width:15vh;font-weight:500;letter-spacing:.1em;font-size:clamp(14px,2.2vh,28px)}
.how b{display:flex;margin:0 auto 1.2vh;width:6vh;height:6vh;border-radius:50%;background:var(--ink);color:var(--cream);align-items:center;justify-content:center;font-size:3vh;font-weight:600;letter-spacing:0}
.how span{display:block;font-family:'Reem Kufi',serif;letter-spacing:0;font-size:1.2em}

/* ===== sticker editor ===== */
#edit{justify-content:flex-start;gap:1.2vh;padding:2.5vh 4%}
#editor{position:relative;height:57%;aspect-ratio:9/16;flex:none;background:var(--soft);box-shadow:1.4vh 1.4vh 0 rgba(0,0,0,.28)}
#base{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#layer{position:absolute;left:5.185%;top:2.917%;width:89.63%;height:80.42%;overflow:hidden;touch-action:none}
.stk{position:absolute;touch-action:none;cursor:grab}
.stk img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none}
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility 0s .28s}#hud.on{opacity:1;visibility:visible;transition-delay:0s}
#sb{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 1px rgba(18,26,34,.7),inset 0 0 0 1px rgba(18,26,34,.7)}
.hd{position:absolute;width:5vh;height:5vh;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:2.6vh;line-height:1;pointer-events:auto;touch-action:none;cursor:pointer;border:2px solid #fff}
#dl{left:0;top:0;transform:translate(-50%,-50%)}
#rs{right:0;bottom:0;transform:translate(50%,50%);cursor:nwse-resize}
#tray{background:var(--cream);width:100%;padding:1vh;display:flex;flex-direction:column;gap:1vh;flex:none}
#tabs,#picker{display:flex;gap:1vh;overflow-x:auto;scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar,#picker::-webkit-scrollbar{display:none}
#tabs button{display:flex;align-items:center;justify-content:center;width:5.8vh;height:5.8vh;padding:0;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;flex:none;font-size:clamp(16px,2.6vh,30px)}
#tabs button.on{background:var(--ink);color:var(--cream)}
#picker img{height:11vh;width:11vh;object-fit:contain;flex:none;cursor:pointer}
#emsg{margin:0;padding:.8vh 2vh;background:var(--cream);font-size:clamp(12px,1.8vh,22px)}
#pwrap{position:relative;height:56%;aspect-ratio:9/16;flex:none;box-shadow:1.4vh 1.4vh 0 rgba(0,0,0,.28)}
#photo{display:block;height:100%;width:100%}
#player{position:absolute;left:5.185%;top:2.917%;width:89.63%;height:80.42%;overflow:hidden;pointer-events:none}
#stage,#stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::selection{background:transparent}
img{-webkit-user-drag:none}
.stk canvas{display:block;width:100%;height:auto;pointer-events:none}
#tabs,#picker{touch-action:pan-x;cursor:grab}
#picker .sw{flex:none;width:8vh;height:11vh;object-fit:cover;border:.5vh solid transparent;cursor:pointer}
#picker .sw.on{border-color:var(--ink)}

#start.on>.cta{animation:rise 1.2s var(--ease) calc(var(--d,.2s) + .3s) both,cta 2.2s ease-out 2.8s infinite}
/* ===== proportions, language, motion ===== */
#stage{--col:38vh}
#stage[lang=ar]{font-family:'Reem Kufi','Oswald',sans-serif}
#stage[lang=ar] *{letter-spacing:0!important}
#stage[lang=ar] .btn,#stage[lang=ar] .steps b{font-weight:700}
.langs{display:flex;gap:2vh;width:var(--col)}
.langs{direction:ltr}
.langs .btn{flex:1;justify-content:center;padding:2.4vh 0;font-size:clamp(16px,2.8vh,36px);text-transform:none}
.lang[data-l=en]{font-family:'Oswald',sans-serif;letter-spacing:.08em}
.lang[data-l=ar]{font-family:'Reem Kufi',sans-serif;letter-spacing:0;font-weight:700}
#go{width:var(--col);justify-content:center;padding:2.4vh 0;font-size:clamp(18px,3.2vh,40px)}
.how{width:var(--col);margin:0 0 4vh}
.how li{flex:1;min-width:0;padding:1.6vh .4vh}
.how em{font-style:normal;display:block}
.how li{font-size:clamp(12px,1.9vh,24px);letter-spacing:.04em}
#stage[lang=ar] .roll{height:1.8em;line-height:1.8}
#err{max-width:var(--col)}
#stage[dir=rtl] .btn.hot .arr{transform:translateX(-1.4vh)}
#tray{direction:ltr}

/* steps */
.steps b.done{color:var(--ink)}
.steps b.done i{background:var(--soft);border-color:var(--ink)}
.steps b.on i,.steps b.done i{animation:stepPop .6s var(--ease) .45s both}
.steps b.on i{animation:stepPop .6s var(--ease) .45s both,stepRing 2.2s ease-out 1.3s infinite}
.steps b.on::before,.steps b.done::before{background:var(--ink);transform-origin:left;animation:grow .9s var(--ease) .3s both}
#stage[dir=rtl] .steps b.on::before,#stage[dir=rtl] .steps b.done::before{transform-origin:right}
@keyframes stepPop{from{scale:.5;opacity:.3}60%{scale:1.15}to{scale:1;opacity:1}}
@keyframes stepRing{0%{box-shadow:0 0 0 0 rgba(18,26,34,.35)}100%{box-shadow:0 0 0 1.3vh rgba(18,26,34,0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* call-to-action pulse + tap confirmation */
.btn.cta{animation:cta 2.2s ease-out 1.6s infinite}
@keyframes cta{0%{box-shadow:0 0 0 0 rgba(18,26,34,.4)}70%,100%{box-shadow:0 0 0 1.8vh rgba(18,26,34,0)}}
.btn.cf{animation:cf .45s var(--ease)}
@keyframes cf{40%{scale:1.06}}
#tick{position:absolute;left:50%;top:50%;z-index:6;width:16vh;height:16vh;margin:-8vh 0 0 -8vh;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:7vh;opacity:0;pointer-events:none}
#tick.go{animation:tickPop 1s var(--ease)}
@keyframes tickPop{0%{opacity:0;scale:.4}25%{opacity:1;scale:1.08}40%{scale:1}75%{opacity:1}100%{opacity:0;scale:1}}

/* editor feedback */
.stk.new{animation:stkPop .55s var(--ease)}
@keyframes stkPop{from{scale:.4;opacity:0}60%{scale:1.08}to{scale:1;opacity:1}}
#picker img.tp{animation:thumb .4s var(--ease)}
@keyframes thumb{40%{transform:scale(.82)}}
#picker .sw.on{animation:thumb .45s var(--ease)}
#base.swap{animation:swap .6s var(--ease)}
@keyframes swap{from{scale:.97;filter:brightness(1.2)}to{scale:1;filter:none}}
#tabs button.on i{animation:ico .55s var(--ease)}
@keyframes ico{40%{transform:scale(1.3) rotate(-8deg)}}

/* scroll arrows */
.scr{position:relative;flex:none;min-width:0}
.nav{position:absolute;top:0;bottom:0;z-index:2;width:5vh;border:0;padding:0;color:var(--ink);font-size:2.4vh;display:flex;align-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.nav.l{left:0;justify-content:flex-start;background:linear-gradient(to right,var(--cream) 45%,transparent)}
.nav.r{right:0;justify-content:flex-end;background:linear-gradient(to left,var(--cream) 45%,transparent)}
.nav.show{opacity:1;pointer-events:auto}
.nav.l i{animation:nudgeL 1.4s var(--io) infinite}
.nav.r i{animation:nudgeR 1.4s var(--io) infinite}
@keyframes nudgeR{50%{transform:translateX(.8vh)}}
@keyframes nudgeL{50%{transform:translateX(-.8vh)}}

/* ===== v2: intro ===== */
#intro{--col:29vh}
#intro>.langs{flex-direction:column;gap:1.4vh;width:var(--col)}
#intro>.langs .btn{flex:none;width:100%;padding:2.1vh 0}
#bigw{padding-bottom:3vh}#big55{height:10vh}

/* ===== v2: editor layout ===== */
#edit{padding:2vh 4%;gap:1.1vh}
#editor{height:51%}
#emsg{display:none!important}
#tray{height:24.5vh;gap:1vh}
#modes{position:relative;display:flex;gap:.8vh;flex:none;direction:ltr}
#modes>button{position:relative;z-index:1;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:.6vh;height:5.4vh;padding:0 .6vh;border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:500;letter-spacing:.02em;font-size:clamp(10px,1.55vh,18px);text-transform:uppercase;cursor:pointer;white-space:nowrap;overflow:hidden;transition:color .45s var(--ease),transform .3s var(--ease)}
#modes>button:active{transform:scale(.94)}
#modes>button.on{color:var(--cream)}
#modes>button span{overflow:hidden;text-overflow:ellipsis}
#modes>button.on i{animation:ico .55s var(--ease)}
#pill{position:absolute;left:0;top:0;height:5.4vh;width:0;background:var(--ink);z-index:0;transition:transform .65s var(--ease),width .65s var(--ease)}
#tscr{overflow:hidden;max-height:5.8vh;transition:max-height .6s var(--ease),opacity .4s,margin .6s var(--ease)}
#tray:not([data-m=stk]) #tscr{max-height:0;opacity:0;margin-bottom:-1vh;pointer-events:none}
#pscr{flex:1;min-height:0}
#pscr #picker{height:100%;align-items:stretch}
#picker img:not(.sw){height:100%;width:auto;aspect-ratio:1;object-fit:contain}
#picker .sw{position:relative;height:100%;width:auto;aspect-ratio:9/16;transition:transform .35s var(--ease),border-color .3s}
#picker .sw.lc{aspect-ratio:1;height:72%;align-self:center}
#picker img:active,#picker .sw:active{transform:scale(.92)}
#picker .sw.lc.on::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:3.4vh;font-weight:600;text-shadow:0 0 .8vh rgba(0,0,0,.55);animation:ico .5s var(--ease)}
#picker .sw.dis{opacity:.28;pointer-events:none}
#picker .sw.dis::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--ink);rotate:-45deg}

/* hud + sticker micro-animations */
#hud.pop .hd{animation:hdIn .45s var(--ease) both}
#hud.pop #sb{animation:sbIn .35s var(--ease) both}
@keyframes hdIn{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
@keyframes sbIn{from{opacity:0}to{opacity:1}}
.stk.gone{animation:stkOut .32s var(--io) both;pointer-events:none}
@keyframes stkOut{to{scale:.3;opacity:0}}
.pburst{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;border:.4vh solid #fff;box-shadow:0 0 0 1px rgba(18,26,34,.35);translate:-50% -50%;pointer-events:none;animation:burst .7s var(--ease) both}
@keyframes burst{from{scale:.2;opacity:.95}to{scale:2.6;opacity:0}}
.oldbase{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* toast */
#toast{position:absolute;z-index:9;left:50%;top:2vh;display:flex;align-items:center;gap:1.2vh;background:var(--ink);color:var(--cream);padding:1.3vh 2.4vh;font-size:clamp(12px,1.9vh,22px);letter-spacing:.08em;white-space:nowrap;transform:translate(-50%,-180%);opacity:0;pointer-events:none;transition:transform .6s var(--ease),opacity .35s;box-shadow:.6vh .6vh 0 rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast[data-k=check] i{color:#7fd39a}#toast[data-k=x] i{color:#ff8a80}

/* camera */
#ring{position:absolute;left:50%;top:50%;width:34vh;height:34vh;margin:-17vh 0 0 -17vh;border-radius:50%;border:.5vh solid #fff;opacity:0;pointer-events:none}
#ring.go{animation:ringOut 1s var(--ease)}
@keyframes ringOut{from{opacity:.85;scale:.55}to{opacity:0;scale:1.5}}
video.shot{animation:shot .7s var(--ease)}
@keyframes shot{from{scale:1.07;filter:brightness(1.5)}to{scale:1;filter:none}}

/* ===== v2: final screen ===== */
.screen.enter.fx{animation:fxIn .8s var(--io) both}
.screen.out.fx{animation:fxOut .9s var(--io) both}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
@keyframes fxOut{to{opacity:0}}
#res{justify-content:center;padding:3vh 5%;gap:2vh}
#pwrap{height:60%;overflow:hidden;transform-origin:0 0}
#pwrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%)}
#pwrap.shine::after{animation:shine 1.1s var(--io)}
@keyframes shine{to{transform:translateX(120%)}}
#badge{position:absolute;left:50%;top:50%;width:14vh;height:14vh;margin:-7vh 0 0 -7vh;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:6vh;scale:0;opacity:0;pointer-events:none;z-index:3}
#badge::after{content:"";position:absolute;inset:0;border-radius:50%;border:.6vh solid var(--cream);opacity:0}
#badge.go{animation:badge 1.5s var(--ease) both}
#badge.go::after{animation:tring 1.1s var(--ease) .1s both}
@keyframes badge{0%{scale:0;opacity:0}22%{scale:1.1;opacity:1}34%{scale:1}72%{scale:1;opacity:1}100%{scale:.8;opacity:0}}
#qrbox.ok{animation:qrpop .8s var(--ease)}
@keyframes qrpop{0%{scale:.85;box-shadow:0 0 0 0 rgba(18,26,34,.4)}45%{scale:1.04}100%{scale:1;box-shadow:0 0 0 2.2vh rgba(18,26,34,0)}}
#tick::after{content:"";position:absolute;inset:0;border-radius:50%;border:.6vh solid var(--ink);opacity:0}
#tick.go::after{animation:tring 1s var(--ease)}
@keyframes tring{from{opacity:.8;scale:1}to{opacity:0;scale:2.2}}

/* ===== v3: kiosk lock, start-screen stickers ===== */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;overscroll-behavior:none}
#start>#drift2{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;animation:none}
#drift2 .spr{animation:none}
#start.on #drift2 .spr{animation:sprIn 1.2s var(--ease) calc(var(--dl) + .3s) both,bob var(--dur) ease-in-out calc(var(--dl) + 1.5s) infinite alternate}

/* ===== v4: flat buttons, tabs, spacing, stamp ===== */
.btn{border:0;background:var(--cream)}
#tabs{align-items:center;gap:.8vh}
#tabs button{border:0;background:rgba(18,26,34,.08);color:var(--ink);transition:background .35s var(--ease),color .35s var(--ease),transform .3s var(--ease)}
#tabs button.on{background:var(--ink);color:var(--cream)}
#tabs button:active{transform:scale(.92)}
#tabs button.t{width:auto;padding:0 1.8vh;gap:.8vh;font:inherit;font-size:clamp(11px,1.7vh,20px);font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
#tabs button.t i{font-size:1.1em}
#tabs .dv{flex:none;width:2px;height:55%;background:rgba(18,26,34,.22);margin:0 .4vh}
#editor{height:55%}
#tray{height:19.5vh}
#intro{grid-template-rows:.65fr auto 1.35fr}
#intro>.langs{margin-top:9vh;gap:.6vh}
#start{--col:29vh;justify-content:flex-start;padding-top:22vh}
#start>.logo{margin-bottom:9vh}
.how{margin:0 0 1.2vh;gap:.6vh}
#go{font-size:clamp(16px,2.8vh,36px);padding:2.1vh 0}
#pwrap{transform-origin:50% 50%}
#badge{width:30vh;height:auto;margin:0;border-radius:0;background:none;font-size:0;left:50%;top:50%;translate:-50% -50%;scale:1;opacity:0;rotate:-6deg}
#badge img{display:block;width:100%;filter:drop-shadow(0 .9vh 0 rgba(18,26,34,.35)) drop-shadow(0 0 2.4vh rgba(0,0,0,.25))}
#badge::after,#tick::after{display:none}
#badge.go{animation:stamp 1.7s var(--ease) both}
@keyframes stamp{0%{scale:2.4;opacity:0;rotate:-16deg}16%{scale:.9;opacity:1;rotate:-7deg}26%{scale:1.05;rotate:-6deg}36%{scale:1;rotate:-6deg}78%{scale:1;opacity:1;translate:-50% -50%}100%{scale:1.06;opacity:0;translate:-50% -58%}}
#pwrap.hit{animation:thump .5s var(--ease)}
@keyframes thump{25%{scale:.982}}
#tick{width:24vh;height:auto;margin:0;border-radius:0;background:none;font-size:0;left:50%;top:50%;translate:-50% -50%;rotate:-6deg}
#tick img{display:block;width:100%;filter:drop-shadow(0 .9vh 0 rgba(18,26,34,.35))}
#tick.go{animation:tickStamp 1.1s var(--ease)}
@keyframes tickStamp{0%{opacity:0;scale:2;rotate:-14deg}22%{opacity:1;scale:.92;rotate:-7deg}34%{scale:1.03}44%{scale:1;rotate:-6deg}72%{opacity:1}100%{opacity:0;scale:1.05}}

@keyframes cta{to{opacity:1}}
#badge{width:24vh}
</style>
</head>

  logoK.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(logoRaw.replace(/(\.cls-1\s*\{\s*fill:\s*)#fff/i,"$1#121a22"));

  // buttons: duplicate label for the roll, cursor-aware fill, magnetic pull
  document.querySelectorAll(".btn").forEach(function(b){
    var l=b.querySelector(".lbl");
    if(l){var t=l.textContent;l.className="roll";l.innerHTML="<b>"+t+"</b><b aria-hidden=\"true\">"+t+"</b>"}
    function pos(e){var r=b.getBoundingClientRect();
      b.style.setProperty("--px",(e.clientX-r.left)+"px");b.style.setProperty("--py",(e.clientY-r.top)+"px");return r}
    b.addEventListener("pointerenter",function(e){pos(e);b.classList.add("hot")});
    b.addEventListener("pointermove",function(e){var r=pos(e);
      b.style.setProperty("--tx",((e.clientX-r.left)/r.width-.5)*14+"px");
      b.style.setProperty("--ty",((e.clientY-r.top)/r.height-.5)*8+"px")});
    b.addEventListener("pointerleave",function(e){pos(e);b.classList.remove("hot");
      b.style.setProperty("--tx","0px");b.style.setProperty("--ty","0px")});
  });

  // transition: the incoming screen opens as a circle from the tap point
  function show(id,ev,o){
    var st=$("stage"),r=st.getBoundingClientRect(),to=$(id),from=$(current),fx=o&&o.kind==="fx",dur=fx?900:1150;
    if(to===from)return Promise.resolve();
    if(id!=="cam")decorate(to,id==="res"?resBg:null);
    var cx=ev&&ev.clientX!=null?ev.clientX-r.left:r.width/2,cy=ev&&ev.clientY!=null?ev.clientY-r.top:r.height/2;
    to.style.setProperty("--cx",cx+"px");to.style.setProperty("--cy",cy+"px");
    if(fx){to.classList.add("fx");from.classList.add("fx")}
    to.classList.add("on","enter");from.classList.add("out");current=id;
    return sleep(dur).then(function(){
      from.classList.remove("on","out","fx");to.classList.remove("enter","fx");
    });
  }

  $("start").addEventListener("pointermove",function(e){
    var r=this.getBoundingClientRect();
    $("stage").style.setProperty("--mx",((e.clientX-r.left)/r.width-.5).toFixed(3));
    $("stage").style.setProperty("--my",((e.clientY-r.top)/r.height-.5).toFixed(3));
  });

  var camP=null;
  function openCam(){
    if(stream)return Promise.resolve();
    return camP||(camP=(async function(){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1080},height:{ideal:1920}},audio:false});
      $("v").srcObject=stream;
      await $("v").play().catch(function(){});
    })().catch(function(e){camP=null;throw e}));
  }
  function warmCam(){try{openCam().catch(function(){})}catch(e){}} // ask for the camera as soon as the page opens

  async function run(ev){
    if(busy)return;busy=true;clearTimeout(idle);stopConfetti();
    try{await openCam()}catch(e){
      $("err").textContent="Camera blocked. Allow camera access, or open this page in its own browser tab.";
      $("pick").hidden=false;busy=false;return;
    }
    var p=show("cam",ev);
    await sleep(800);
    $("hint").textContent=tr("ready");
    await sleep(1500);
    $("hint").textContent="";
    var bar=$("bar");bar.classList.remove("run");void bar.offsetWidth;bar.classList.add("run");
    for(var n=3;n>=1;n--){
      var c=$("num");c.textContent=n;c.classList.remove("tick");void c.offsetWidth;c.classList.add("tick");var rg=$("ring");rg.classList.remove("go");void rg.offsetWidth;rg.classList.add("go");
      await sleep(1000);
    }
    $("num").textContent="";bar.classList.remove("run");
    $("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");var vv=$("v");vv.classList.remove("shot");void vv.offsetWidth;vv.classList.add("shot");
    await capture();
    await p;
    await openEdit();
    busy=false;
  }

  function land(){ // photo has settled: shine sweep, confirmation badge, haptic
    if(current!=="res")return;
    var pw=$("pwrap"),b=$("badge");
    b.querySelector("img").src=markURI(markN,"#F4EED7");
    pw.classList.remove("shine");b.classList.remove("go");void pw.offsetWidth;pw.classList.add("shine");b.classList.add("go");
    setTimeout(function(){pw.classList.remove("hit");void pw.offsetWidth;pw.classList.add("hit")},280);
    if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
  }
  async function finish(ev){ // the edited photo flies from the editor to its place on the result screen
    var pw=$("pwrap"),er=$("editor").getBoundingClientRect();
    var p=show("res",ev,{kind:"fx"});publish();
    var pr=pw.getBoundingClientRect();
    if(pw.animate&&!RM&&pr.width){
      var k=er.width/pr.width,dx=er.left-pr.left,dy=er.top-pr.top;
      pw.animate([{transformOrigin:"0 0",transform:"translate("+dx+"px,"+dy+"px) scale("+k+")"},{transformOrigin:"0 0",transform:"translate(0,0) scale(1)"}],{duration:1100,delay:150,easing:"cubic-bezier(.22,1.2,.36,1)",fill:"backwards"});
    }
    setTimeout(land,1250);setTimeout(confetti,1300);
    await p;
  }

  async function capture(src){
    var v=src||$("v"),vw=v.videoWidth||v.naturalWidth||1280,vh=v.videoHeight||v.naturalHeight||720;
    var rw=W-2*M,rh=H-M-BAND;
    photoC=document.createElement("canvas");photoC.width=rw;photoC.height=rh;var x=photoC.getContext("2d");
    var s=Math.max(rw/vw,rh/vh),dw=vw*s,dh=vh*s;
    if(!src){x.translate(rw,0);x.scale(-1,1)}
    x.drawImage(v,(rw-dw)/2,(rh-dh)/2,dw,dh);
    resBg=sessBg;frame={type:"bg",src:resBg};panelCol=sessCol;markN=Math.floor(Math.random()*4);markFrame();
    $("base").removeAttribute("src");
    await compose();
  }

  var panelCol=null,markN=0,frameTaint=false;
  function pickPanel(){ // random panel colour keeps white type legible; a colour chosen by the person is kept
    var ok=PAL.filter(function(c){return contrast(c,"#ffffff")>=2.6&&!(frame.type==="color"&&frame.color===c)});
    if(!panelCol||(frame.type==="color"&&frame.color===panelCol))panelCol=rnd(ok);return panelCol;
  }
  async function compose(){ // frame (colour or backgrounds artwork) + photo + two-part logo lock-up
    var my=++cseq,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
    frameTaint=false;
    if(frame.type==="color"){x.fillStyle=frame.color;x.fillRect(0,0,W,H)}
    else{
      try{
        var bi=await loadImg(U(frame.src)),pc=document.createElement("canvas");pc.width=pc.height=1;
        var px=pc.getContext("2d");px.drawImage(bi,0,0,1,1);px.getImageData(0,0,1,1);
        var k=Math.max(W/bi.width,H/bi.height);x.drawImage(bi,(W-bi.width*k)/2,(H-bi.height*k)/2,bi.width*k,bi.height*k);
      }catch(e){frameTaint=true} // file:// blocks pixel export: leave the frame transparent, the editor shows the artwork behind it
    }
    var rx=M,ry=M,rw=W-2*M,rh=H-M-BAND,gap=30,ty=H-BAND+gap,th=BAND-M-gap;
    x.drawImage(photoC,rx,ry);
    var col=pickPanel(),lpw=Math.round(rw*.64),bw=6,light=contrast(col,"#ffffff")<2.6;markFrame();
    x.fillStyle="#fff";x.fillRect(M,ty,rw,th);
    x.fillStyle=col;x.fillRect(M,ty,lpw,th);
    x.save();x.beginPath();x.rect(M,ty,rw,th);x.clip();x.strokeStyle=col;x.lineWidth=bw*2;x.strokeRect(M,ty,rw,th);x.restore();
    await logoReady;
    var lw=lpw*.7,lh=lw*299.78/911.61;
    x.drawImage(light?logoK:logoH,M+(lpw-lw)/2,ty+(th-lh)/2,lw,lh);
    var vb=window.MARK_SVG[markN].match(/viewBox="[\d.\s-]*?([\d.]+) ([\d.]+)"/),ar=vb[1]/vb[2],pw=rw-lpw;
    try{
      var mi=await loadImg(markURI(markN,contrast(col,"#ffffff")>=2?col:"#121a22")),mw=Math.min(pw*.7,th*.62*ar),mh=mw/ar;
      x.drawImage(mi,M+lpw+(pw-mw)/2,ty+(th-mh)/2,mw,mh);
    }catch(e){}
    if(my!==cseq)return;
    baseC=c;var b=await toBlob(c,"image/png");if(my!==cseq)return;
    var oldU=baseURL;baseURL=URL.createObjectURL(b);setBase(baseURL);if(oldU)setTimeout(function(){URL.revokeObjectURL(oldU)},1500);
    $("editor").style.background=(frame.type==="bg"&&frameTaint)?'url("'+U(frame.src)+'") center/cover no-repeat':"";
  }

  async function upload(b){
    if(!CONFIG.uploadUrl)throw 0;
    var r=await fetch(CONFIG.uploadUrl,{method:"POST",headers:{"Content-Type":b.type||"image/jpeg"},body:b});
    if(!r.ok)throw 0;
    var j=await r.json();if(!j||!j.url)throw 0;
    return new URL(j.url,location.href).href; // full public link, this is what the QR code contains
  }

  async function publish(){
    $("qrbox").textContent=tr("prep");$("msg").textContent="";
    if(degraded){$("qrbox").textContent=tr("na");$("msg").textContent=tr("deg");return}
    var mine=blob;
    try{
      var url=await upload(mine);if(mine!==blob)return;
      var q=qrcode(0,"M");q.addData(url);q.make();
      $("qrbox").innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true});var qb=$("qrbox");qb.classList.remove("ok");void qb.offsetWidth;qb.classList.add("ok");
    }catch(e){
      $("qrbox").textContent=tr("qrfail");
      $("msg").textContent=tr("usesave");
    }
  }

  /* confetti: flag-colour paper (rectangles, slivers, curls) thrown from both sides */
  var raf=null;
  function stopConfetti(){cancelAnimationFrame(raf);raf=null;var c=$("confetti"),x=c.getContext("2d");x.clearRect(0,0,c.width,c.height)}
  function confetti(){
    if(current!=="res")return;
    var cv=$("confetti"),st=$("stage"),d=window.devicePixelRatio||1,w=st.clientWidth,h=st.clientHeight;
    cv.width=w*d;cv.height=h*d;var x=cv.getContext("2d");x.scale(d,d);
    var u=w/500,cols=["#C8102E","#00843D","#121a22"],P=[],rnd=function(a,b){return a+Math.random()*(b-a)};
    for(var i=0;i<130;i++){
      var left=i%2===0,ang=rnd(-1.25,-.55),sp=rnd(14,30)*u;
      P.push({t:rnd(0,.5),x:left?-10:w+10,y:h*rnd(.5,.75),vx:(left?1:-1)*Math.cos(ang)*sp*(left?1:-1)*-1*-1,vy:Math.sin(ang)*sp,
        r:rnd(0,6.28),vr:rnd(-.2,.2),ph:rnd(0,6.28),vp:rnd(.08,.25),c:cols[(Math.random()*3)|0],
        k:Math.random()<.5?0:Math.random()<.55?1:2,w:rnd(5,13)*u,l:rnd(9,22)*u});
    }
    P.forEach(function(p){if(p.x>0)p.vx=-Math.abs(p.vx);else p.vx=Math.abs(p.vx)});
    var t0=performance.now(),last=t0;
    (function frame(now){
      var dt=Math.min((now-last)/16.67,3),T=(now-t0)/1000;last=now;
      x.clearRect(0,0,w,h);var alive=0;
      P.forEach(function(p){
        if(T<p.t){alive++;return}
        p.vx*=Math.pow(.985,dt);p.vy=p.vy*Math.pow(.985,dt)+.42*u*dt;
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.ph+=p.vp*dt;
        if(p.y>h+40)return;alive++;
        x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.ph));
        x.fillStyle=x.strokeStyle=p.c;
        if(p.k===0)x.fillRect(-p.w/2,-p.l/2,p.w,p.l);
        else if(p.k===1)x.fillRect(-p.w/5,-p.l,p.w/3+1,p.l*2);
        else{x.lineWidth=Math.max(2,p.w/3);x.beginPath();x.arc(0,0,p.l/1.6,0,Math.PI*1.1);x.stroke()}
        x.restore();
      });
      if(alive&&T<9)raf=requestAnimationFrame(frame);else stopConfetti();
    })(t0);
  }

  async function reset(ev){
    clearTimeout(idle);stopConfetti();
    ti=(ti+1)%THEMES.length;applyTheme();clearStickers();newSession();
    buildSprites();var p=show("intro",ev);
    $("qrbox").textContent=tr("prep");$("err").textContent="";warnFile();
    await p;
  }


  function navUpd(sc){var n=sc.parentNode;n.querySelector(".nav.l").classList.toggle("show",sc.scrollLeft>6);n.querySelector(".nav.r").classList.toggle("show",sc.scrollLeft+sc.clientWidth<sc.scrollWidth-6)}
  ["tabs","picker"].forEach(function(id){var sc=$(id),n=sc.parentNode;
    sc.addEventListener("scroll",function(){navUpd(sc)},{passive:true});
    n.querySelector(".nav.l").onclick=function(){sc.scrollBy({left:-sc.clientWidth*.7,behavior:"smooth"})};
    n.querySelector(".nav.r").onclick=function(){sc.scrollBy({left:sc.clientWidth*.7,behavior:"smooth"})};
  });
  setInterval(function(){if(current==="edit"){navUpd($("tabs"));navUpd($("picker"))}},400);
  function tick(){var t=$("tick");t.querySelector("img").src=markURI(markN,"#F4EED7");t.classList.remove("go");void t.offsetWidth;t.classList.add("go")}
  $("save").addEventListener("click",function(){tick();toast(tr("saved"),"check")});
  document.querySelectorAll(".btn").forEach(function(b){
    b.addEventListener("click",function(){b.classList.remove("cf");void b.offsetWidth;b.classList.add("cf")});
    b.addEventListener("animationend",function(e){if(e.animationName==="cf")b.classList.remove("cf")});
  });
  setLang("en");warmCam();
  $("go").onclick=run;$("retake").onclick=run;$("done").onclick=reset;
  $("pick").onclick=function(){$("file").click()};
  $("file").onchange=function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var im=new Image();im.onload=async function(){await capture(im);await openEdit()};
    im.src=URL.createObjectURL(f);e.target.value="";
  };

  /* kiosk lock: no context menu, selection, zoom or pinch */
  var stop=function(e){e.preventDefault()};
  ["contextmenu","selectstart","dragstart","dblclick","gesturestart","gesturechange","gestureend"].forEach(function(ev){document.addEventListener(ev,stop,{passive:false})});
  document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
  document.addEventListener("wheel",function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&["+","-","=","_","0"].indexOf(e.key)>=0)e.preventDefault()});
})();

</script>
