<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eid Al Etihad Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <section class="screen on" id="start">
    <div class="shape circle"></div>
    <div class="shape tri"></div>
    <img class="logo" src="logo-vertical.svg" alt="Eid Al Etihad" style="--d:.1s">
    <p class="tag" style="--d:.3s">Strike a pose · اِلتقط صورتك</p>
    <button class="btn solid" id="go" style="--d:.4s"><span class="lbl">Start · ابدأ</span><i class="arr">→</i></button>
    <p id="err"></p>
    <button class="btn" id="pick" hidden><span class="lbl">Take photo instead</span></button>
    <input type="file" id="file" accept="image/*" capture="user" hidden>
  </section>

  <section class="screen" id="cam">
    <video id="v" playsinline muted autoplay></video>
    <div id="frame"><i></i><i></i><i></i><i></i></div>
    <p id="hint"></p>
    <div id="count"><span id="num"></span></div>
    <div id="bar"></div>
    <div id="flash"></div>
  </section>

  <section class="screen" id="res">
    <img id="photo" alt="Your photo">
    <div id="row" style="--d:.55s">
      <div id="qrbox">Preparing…</div>
      <div class="qrtext">
        <div class="en">SCAN TO DOWNLOAD</div>
        <div class="ar">امسح للتحميل</div>
      </div>
    </div>
    <p id="msg" style="--d:.65s"></p>
    <div class="actions" style="--d:.75s">
      <button class="btn" id="retake"><span class="lbl">Retake</span></button>
      <a class="btn" id="save" download="eid-al-etihad-photo.jpg"><span class="lbl">Save</span></a>
      <button class="btn solid" id="done"><span class="lbl">Done</span></button>
    </div>
  </section>
  <canvas id="confetti"></canvas>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="logo-data.js"></script>
<script src="script.js"></script>
</body>
</html>
